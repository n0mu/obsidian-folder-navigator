name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `build` runs `typecheck` (src, test and e2e projects) before bundling.
      # The e2e suite needs a desktop Obsidian install, so it runs locally
      # (`npm run test:e2e`, also part of `preversion`), not here.
      - name: Typecheck and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
