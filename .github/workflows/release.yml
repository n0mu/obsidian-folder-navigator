name: Release

# Tags are created by `npm version` (no "v" prefix), e.g. 0.6.0 or 0.6.0-rc.1.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes for pre-releases need the tag history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release job

      - name: Check the tag matches manifest.json and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$manifest" ] || [ "$TAG" != "$package" ]; then
            echo "::error::tag $TAG, manifest.json $manifest, package.json $package"
            exit 1
          fi

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/main.js
            build/manifest.json
            build/styles.css

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node version-changelog.mjs --notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag "${flags[@]}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            build/main.js build/manifest.json build/styles.css
